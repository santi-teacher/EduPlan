<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduPlan System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    
    /* ซ่อน Scrollbar สำหรับตารางแต่ยังเลื่อนได้ */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .table-container::-webkit-scrollbar { height: 6px; }
    .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* ป้องกัน UI ทับแถบ Home bar ของ iOS */
    .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    .pt-safe { padding-top: max(0.5rem, env(safe-area-inset-top)); }
    
    /* ป้องกันการซูมหน้าจอเมื่อกดช่องกรอกข้อมูลใน iOS */
    @media screen and (max-width: 767px) {
      input, select, textarea { font-size: 16px !important; }
    }

    table { page-break-inside: auto; width: 100%; }
    .min-w-table { min-width: 800px; }
    
    tr { page-break-inside: avoid; page-break-after: auto; }
    thead { display: table-header-group; }
    tfoot { display: table-footer-group; }

    .page-break-avoid {
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { background-color: #ffffff !important; }
      .no-print { display: none !important; }
      .print-full-width { width: 100% !important; margin: 0 !important; max-width: none !important; }
    }
  </style>

  <!-- Babel & html2pdf -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-50">

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid, LabelList } from 'https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0';
    import { Wallet, FileText, CheckCircle, AlertCircle, PlusCircle, LayoutDashboard, ListOrdered, Edit, Trash2, Check, X, Lock, Unlock, KeyRound, PieChart as PieChartIcon, Settings, Tags, Loader2, Menu, RefreshCcw, TrendingUp, Download, Printer, ImageOff, ShieldAlert, FolderPlus, FolderOpen, BarChart3, Home, ChevronRight } from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';

    const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#ffc658', '#ff7300'];

    // ====================================================
    // นำ Web App URL ที่ได้จาก Google Apps Script มาใส่ที่นี่
    // ====================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbynj3tV-SjuwQMItvDR-XKp4o1XQDLPF5PtkH4Y7Xu8tCpkguQj_i1Typ9KefiBSlQ/exec'; // <--- แทนที่ข้อความนี้ด้วย URL ของคุณ
    
    const api = {
      call: (functionName, ...args) => {
        return new Promise((resolve, reject) => {
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject)
              [functionName](...args);
          } else {
            console.warn(`[Local Mock] Called GAS function: ${functionName}`, args);
            setTimeout(() => {
              if (functionName === 'getInitialData') {
                resolve(JSON.stringify({ 
                  activities: [
                    { id: 1, name: 'กิจกรรมเปิดบ้าน', allocatedBudget: 50000, moneyType: 'เงินอุดหนุน ค่ากิจกรรมพัฒนาฯ', responsible: 'นายสมชาย', status: 'กำลังดำเนินการ', projectId: 'default', projectResponsible: 'ระบุชื่อ', managementGroup: 'บริหารวิชาการ', plan: 'ระบุแผนงาน' },
                    { id: 2, name: 'ปรับปรุงห้องสมุด', allocatedBudget: 120000, moneyType: 'เงินอุดหนุน ค่าจัดการเรียนการสอน', responsible: 'นางสมศรี', status: 'ยังไม่เริ่มต้น', projectId: 'default', projectResponsible: 'ระบุชื่อ', managementGroup: 'บริหารวิชาการ', plan: 'ระบุแผนงาน' },
                    { id: 3, name: 'ค่าน้ำประปา', allocatedBudget: 50000, moneyType: 'รายได้สถานศึกษา', responsible: 'การเงิน', status: 'กำลังดำเนินการ', projectId: 'reg1', projectResponsible: 'การเงิน', managementGroup: 'บริหารงบประมาณ', plan: 'รายจ่ายประจำ' }
                  ], 
                  expenses: [
                    { id: 101, activityId: 1, activityName: 'กิจกรรมเปิดบ้าน', date: '2026-04-05', type: 'จัดซื้อ', details: 'ค่าวัสดุอุปกรณ์', amount: 15000, projectId: 'default', projectResponsible: 'ระบุชื่อ', managementGroup: 'บริหารวิชาการ', plan: 'ระบุแผนงาน' },
                    { id: 102, activityId: 3, activityName: 'ค่าน้ำประปา', date: '2026-04-10', type: 'จัดซื้อ', details: 'บิลเดือนเมษา', amount: 4500, projectId: 'reg1', projectResponsible: 'การเงิน', managementGroup: 'บริหารงบประมาณ', plan: 'รายจ่ายประจำ' }
                  ], 
                  config: {
                    adminPassword: 'admin',
                    schoolName: '',
                    appModes: [
                      { id: 'NORMAL', name: 'แผนงาน/โครงการ' },
                      { id: 'REGULAR', name: 'รายจ่ายประจำ' }
                    ],
                    moneyTypes: ['เงินอุดหนุน ค่าจัดการเรียนการสอน', 'เงินอุดหนุน ค่ากิจกรรมพัฒนาฯ', 'รายได้สถานศึกษา', 'สอร.', 'ลูกเสือ'],
                    expenseTypes: ['จัดซื้อ', 'จัดจ้าง', 'อื่นๆ', 'โยกเงิน'],
                    statusTypes: ['ยังไม่เริ่มต้น', 'อยู่ระหว่างดำเนินการ', 'กำลังดำเนินการ', 'ดำเนินการสำเร็จ'],
                    projects: [
                      { id: 'default', projectName: '(2569) โครงการตัวอย่าง', managementGroup: 'บริหารวิชาการ', responsible: 'ระบุชื่อ', plan: 'ระบุแผนงาน', strategy: 'ระบุกลยุทธ์', logoUrl: '', projectType: 'NORMAL' },
                      { id: 'reg1', projectName: 'ค่าสาธารณูปโภค', managementGroup: 'บริหารงบประมาณ', responsible: 'การเงิน', plan: 'รายจ่ายประจำ', strategy: '-', logoUrl: '', projectType: 'REGULAR' }
                    ]
                  } 
                }));
              } else {
                resolve(true);
              }
            }, 500);
          }
        });
      }
    };

    function App() {
      const [isInitializing, setIsInitializing] = useState(true);
      const [isSaving, setIsSaving] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [toastMessage, setToastMessage] = useState('');
      const [activeTab, setActiveTab] = useState('dashboard'); 
      const [appMode, setAppMode] = useState('NORMAL');
      
      const [appModes, setAppModes] = useState([
        { id: 'NORMAL', name: '' },
        { id: 'REGULAR', name: '' }
      ]);
      const currentModeName = appModes.find(m => m.id === appMode)?.name || 'รายการ';
      const [editingMode, setEditingMode] = useState(null); // สำหรับ UI แก้ไขชื่อโหมด
      
      // Data State
      const [allActivities, setAllActivities] = useState([]);
      const [allExpenses, setAllExpenses] = useState([]);
      
      // Multi-Project State
      const [projects, setProjects] = useState([]);
      const [selectedProjectId, setSelectedProjectId] = useState('');
      const [selectedGroupFilter, setSelectedGroupFilter] = useState('ALL');
      
      const [moneyTypes, setMoneyTypes] = useState([]);
      const [expenseTypes, setExpenseTypes] = useState([]);
      const [statusTypes, setStatusTypes] = useState([]);
      const [themeColors, setThemeColors] = useState({ primary: '#16a34a', chartExpense: '#ec4899', chartRemaining: '#10b981' });
      const [adminPassword, setAdminPassword] = useState('admin999');
      const [schoolName, setSchoolName] = useState('');

      // 1. กรอง Project ตาม Mode ปัจจุบัน (รองรับความเข้ากันได้กับ ID เก่า)
      const currentModeProjects = projects.filter(p => p.projectType === appMode || (!p.projectType && appMode === 'NORMAL'));
      const validProjectNames = currentModeProjects.map(p => p.projectName);
      const validProjectIds = currentModeProjects.map(p => p.id);

      // 2. จัดการ selectedProjectId เมื่อสลับ Mode
      useEffect(() => {
        if (!isInitializing) {
          if (currentModeProjects.length > 0 && !currentModeProjects.find(p => p.id === selectedProjectId)) {
            setSelectedProjectId(currentModeProjects[0].id);
            setSelectedGroupFilter('ALL');
          } else if (currentModeProjects.length === 0) {
            setSelectedProjectId('');
          }
        }
      }, [appMode, projects, isInitializing]);

      // Filtered data for the active project
      const activeProject = currentModeProjects.find(p => p.id === selectedProjectId) || null;
      const activities = activeProject ? allActivities.filter(a => a.projectId === activeProject.projectName || a.projectId === activeProject.id || (!a.projectId && activeProject.id === 'default')) : [];
      const expenses = activeProject ? allExpenses.filter(e => e.projectId === activeProject.projectName || e.projectId === selectedProjectId || (!e.projectId && selectedProjectId === projects[0]?.id)) : [];

      // Filtered data for the Entire Mode (For Global Dashboard)
      const modeActivities = allActivities.filter(a => {
        if (!a.projectId && appMode === 'NORMAL') return true;
        return validProjectNames.includes(a.projectId) || validProjectIds.includes(a.projectId);
      });
      const modeExpenses = allExpenses.filter(e => {
        if (!e.projectId && appMode === 'NORMAL') return true;
        return validProjectNames.includes(e.projectId) || validProjectIds.includes(e.projectId);
      });

      const [settingsModal, setSettingsModal] = useState({ 
        isOpen: false, 
        activeTab: 'project-edit',
        editProjectData: {}, 
        newProjectData: { projectName: '', managementGroup: '', responsible: '', plan: '', strategy: '', logoUrl: '' },
        colors: {}, 
        password: '',
        schoolName: '',
        typeTab: 'money'
      });
      const [newTypeInput, setNewTypeInput] = useState('');
      
      const [isAdmin, setIsAdmin] = useState(false);
      const [authModal, setAuthModal] = useState({ isOpen: false, password: '', error: '' });
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
      const [statusDetailModal, setStatusDetailModal] = useState({ isOpen: false, status: '', activities: [] });

      const showToast = (msg) => { setToastMessage(msg); };

      useEffect(() => {
        if (toastMessage) {
          const timer = setTimeout(() => setToastMessage(''), 3500);
          return () => clearTimeout(timer);
        }
      }, [toastMessage]);

      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 1024) { setIsSidebarOpen(false); } 
          else { setIsSidebarOpen(true); }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      useEffect(() => {
        const fetchData = async () => {
          try {
            const resultString = await api.call('getInitialData');
            const data = JSON.parse(resultString);
            
            if (data.activities && data.activities.length > 0) setAllActivities(data.activities);
            if (data.expenses && data.expenses.length > 0) setAllExpenses(data.expenses);
            
            if (data.config) {
              if (data.config.appModes) setAppModes(data.config.appModes);
              if (data.config.moneyTypes) setMoneyTypes(data.config.moneyTypes);
              if (data.config.expenseTypes) setExpenseTypes(data.config.expenseTypes);
              if (data.config.statusTypes) setStatusTypes(data.config.statusTypes);
              if (data.config.themeColors) setThemeColors(data.config.themeColors);
              if (data.config.adminPassword) setAdminPassword(data.config.adminPassword);
              if (data.config.schoolName !== undefined) setSchoolName(data.config.schoolName);
              
              if (data.config.projects && data.config.projects.length > 0) {
                setProjects(data.config.projects);
              } else if (data.config.projectInfo) {
                const defaultProj = { id: 'default', ...data.config.projectInfo, managementGroup: '', projectType: 'NORMAL' };
                setProjects([defaultProj]);
              } else {
                const defaultProj = { id: 'default', projectName: 'โครงการเริ่มต้น', managementGroup: '', responsible: '', plan: '', strategy: '', logoUrl: '', projectType: 'NORMAL' };
                setProjects([defaultProj]);
              }
            }
          } catch (error) {
            console.error("Error fetching data:", error);
            showToast("ไม่สามารถดึงข้อมูลจากฐานข้อมูลได้ (โปรดตรวจสอบ URL ของ GAS)");
          } finally {
            setIsInitializing(false);
          }
        };
        fetchData();
      }, []);

      const formatCurrency = (amount) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
      const formatDate = (dateInput) => {
        if (!dateInput) return '-';
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear() + 543;
        return `${day}/${month}/${year}`;
      };

      const uniqueActivityNames = [...new Set(activities.map(a => a.name))];
      const uniqueResponsibles = [...new Set(activities.map(a => a.responsible).filter(Boolean))];

      const uniqueGroups = [...new Set(currentModeProjects.map(p => p.managementGroup || 'ไม่ระบุกลุ่มบริหาร'))];
      const filteredProjectsDropdown = selectedGroupFilter === 'ALL'
        ? currentModeProjects
        : currentModeProjects.filter(p => (p.managementGroup || 'ไม่ระบุกลุ่มบริหาร') === selectedGroupFilter);

      const handleGroupFilterChange = (e) => {
        const newGroup = e.target.value;
        setSelectedGroupFilter(newGroup);
        const availableProjs = newGroup === 'ALL'
          ? currentModeProjects
          : currentModeProjects.filter(p => (p.managementGroup || 'ไม่ระบุกลุ่มบริหาร') === newGroup);

        if (availableProjs.length > 0 && !availableProjs.find(p => p.id === selectedProjectId)) {
           setSelectedProjectId(availableProjs[0].id);
        }
      };

      const handleLogin = () => {
        if (authModal.password === adminPassword || authModal.password === 'admin999') { 
          setIsAdmin(true);
          setAuthModal({ isOpen: false, password: '', error: '' });
          showToast("เข้าสู่ระบบผู้ดูแลสำเร็จ");
        } else {
          setAuthModal({ ...authModal, error: 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง' });
        }
      };

      const handleSidebarMenuClick = (tabId) => {
        setActiveTab(tabId);
        if (window.innerWidth < 1024) {
          setIsSidebarOpen(false);
        }
      };

      const AppLogo = ({ className, size = 24 }) => {
        if (activeProject && activeProject.logoUrl) {
          return (
            <img 
              src={activeProject.logoUrl} 
              alt="Logo" 
              className={`object-contain ${className}`}
              style={{ maxHeight: size * 1.5, maxWidth: size * 1.5 }}
              onError={(e) => { e.target.style.display = 'none'; }} 
            />
          );
        }
        return <Wallet size={size} className={`shrink-0 ${className}`} />;
      };

      // Component สำหรับแสดงหน้าเมื่อไม่มีโครงการในโหมดนั้น
      const EmptyStateView = () => (
        <div className="flex flex-col items-center justify-center py-20 px-4 text-center bg-white rounded-2xl border border-gray-100 shadow-sm mt-4 animate-in fade-in">
          <FolderPlus size={64} className="text-gray-300 mb-4" />
          <h2 className="text-xl md:text-2xl font-bold text-gray-700 mb-2">ยังไม่มีข้อมูลในหมวด {currentModeName}</h2>
          <p className="text-gray-500 mb-8 font-medium">กรุณาสร้างรายการใหม่เพื่อเริ่มบันทึกข้อมูล</p>
          {isAdmin ? (
            <button 
              onClick={() => setSettingsModal({ 
                isOpen: true, 
                editProjectData: {}, 
                newProjectData: { projectName: '', managementGroup: '', responsible: '', plan: '', strategy: '', logoUrl: '' },
                colors: { ...themeColors }, 
                password: adminPassword, 
                schoolName: schoolName,
                activeTab: 'project-new', 
                typeTab: 'money' 
              })} 
              className="bg-blue-600 text-white px-6 py-3.5 rounded-xl font-bold hover:bg-blue-700 shadow-md flex items-center gap-2 active:scale-95 transition-all"
            >
              <PlusCircle size={20} /> สร้างรายการใหม่
            </button>
          ) : (
            <div className="text-sm text-gray-400 bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">
              กรุณาเข้าสู่ระบบ Admin เพื่อสร้างข้อมูลใหม่
            </div>
          )}
        </div>
      );

      // ==========================================
      // VIEW 0: Global Dashboard
      // ==========================================
      const GlobalDashboardView = () => {
        const totalProjects = currentModeProjects.length;
        const globalIncome = modeActivities.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
        const globalExpense = modeExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
        const globalBalance = globalIncome - globalExpense;

        const globalExpensePercent = globalIncome > 0 ? ((globalExpense / globalIncome) * 100).toFixed(1) : 0;
        const globalBalancePercent = globalIncome > 0 ? ((globalBalance / globalIncome) * 100).toFixed(1) : 0;
        
        const globalChartData = [
          { name: 'ใช้ไป', value: globalExpense },
          { name: 'คงเหลือ', value: globalBalance > 0 ? globalBalance : 0 }
        ];

        // หากิจกรรมที่ไม่ซ้ำชื่อกันสำหรับแสดงในกล่องสถานะ
        const uniqueModeActivitiesList = [];
        const seenModeNames = new Set();
        modeActivities.forEach(act => {
          if (!seenModeNames.has(act.name)) {
            seenModeNames.add(act.name);
            uniqueModeActivitiesList.push(act);
          }
        });

        const inProgressCount = uniqueModeActivitiesList.filter(a => a.status === 'อยู่ระหว่างดำเนินการ' || a.status === 'กำลังดำเนินการ').length;
        const completedCount = uniqueModeActivitiesList.filter(a => a.status === 'ดำเนินการสำเร็จ' || a.status === 'เสร็จสิ้น').length;
        const totalActCount = uniqueModeActivitiesList.length;

        const projectCompareData = currentModeProjects.map(p => {
          const pActs = modeActivities.filter(a => a.projectId === p.projectName || a.projectId === p.id || (!a.projectId && p.id === 'default'));
          const pExps = modeExpenses.filter(e => e.projectId === p.projectName || e.projectId === p.id || (!e.projectId && p.id === 'default'));
          const income = pActs.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
          const expense = pExps.reduce((sum, e) => sum + Number(e.amount), 0);
          const percent = income > 0 ? ((expense / income) * 100).toFixed(1) : 0;
          return { name: p.projectName, 'งบประมาณ': income, 'ใช้ไป': expense, 'คงเหลือ': income - expense, 'percentLabel': percent > 0 ? `${percent}%` : '' };
        });

        const projGroupMap = {};
        currentModeProjects.forEach(p => { 
          projGroupMap[p.id] = p.managementGroup || 'ไม่ระบุกลุ่มบริหาร'; 
          projGroupMap[p.projectName] = p.managementGroup || 'ไม่ระบุกลุ่มบริหาร'; 
        });

        const allGroups = [...new Set(currentModeProjects.map(p => p.managementGroup || 'ไม่ระบุกลุ่มบริหาร'))];
        const groupCompareData = allGroups.map(group => {
          const gActs = modeActivities.filter(a => (projGroupMap[a.projectId || 'default'] || 'ไม่ระบุกลุ่มบริหาร') === group);
          const gActIds = gActs.map(a => a.id);
          const gExps = modeExpenses.filter(e => gActIds.includes(e.activityId));
          const income = gActs.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
          const expense = gExps.reduce((sum, e) => sum + Number(e.amount), 0);
          const percent = income > 0 ? ((expense / income) * 100).toFixed(1) : 0;
          const projectCount = currentModeProjects.filter(p => (p.managementGroup || 'ไม่ระบุกลุ่มบริหาร') === group).length;
          return { name: group, 'งบประมาณ': income, 'ใช้ไป': expense, 'คงเหลือ': income - expense, 'percentLabel': percent > 0 ? `${percent}%` : '', projectCount };
        }).filter(d => d['งบประมาณ'] > 0 || d['ใช้ไป'] > 0);

        const allMoneyTypes = [...new Set(modeActivities.map(a => a.moneyType))];
        const moneyTypeCompareData = allMoneyTypes.map(type => {
          const mActs = modeActivities.filter(a => a.moneyType === type);
          const mActIds = mActs.map(a => a.id);
          const mExps = modeExpenses.filter(e => mActIds.includes(e.activityId));
          const income = mActs.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
          const expense = mExps.reduce((sum, e) => sum + Number(e.amount), 0);
          const percent = income > 0 ? ((expense / income) * 100).toFixed(1) : 0;

      // ==========================================
      // VIEW 1: Ledger (บันทึก)

      const LedgerView = () => {
        const [newAct, setNewAct] = useState({ name: '', allocatedBudget: '', moneyType: moneyTypes[0] || '', responsible: '', status: statusTypes[0] || 'ยังไม่เริ่มต้น' });
        const initialActName = uniqueActivityNames[0] || '';
        const initialMoneyTypes = activities.filter(a => a.name === initialActName).map(a => a.moneyType);
        
        const [newExp, setNewExp] = useState({ 
          date: '', type: expenseTypes[0] || '', details: '', amount: '', 
          activityName: initialActName, moneyType: initialMoneyTypes[0] || ''
        });

        const [editingActId, setEditingActId] = useState(null);
        const [editActForm, setEditActForm] = useState({});
        const [editingExpId, setEditingExpId] = useState(null);
        const [editExpForm, setEditExpForm] = useState({});

        const totalIncome = activities.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
        const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
        const totalBalance = totalIncome - totalExpense;

        const totalExpensePercent = totalIncome > 0 ? ((totalExpense / totalIncome) * 100).toFixed(1) : 0;
        const totalBalancePercent = totalIncome > 0 ? ((totalBalance / totalIncome) * 100).toFixed(1) : 0;

        const uniqueActivitiesList = [];
        const seenNames = new Set();
        activities.forEach(act => {
          if (!seenNames.has(act.name)) { seenNames.add(act.name); uniqueActivitiesList.push(act); }
        });
        const totalActCount = uniqueActivitiesList.length;
        const inProgressCount = uniqueActivitiesList.filter(a => a.status === 'อยู่ระหว่างดำเนินการ' || a.status === 'กำลังดำเนินการ').length;
        const completedCount = uniqueActivitiesList.filter(a => a.status === 'ดำเนินการสำเร็จ' || a.status === 'เสร็จสิ้น').length;

        const moneyTypeProgress = moneyTypes.map(type => {
          const typeActs = activities.filter(a => a.moneyType === type);
          const allocated = typeActs.reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
          const targetIds = typeActs.map(a => a.id);
          const typeExp = expenses.filter(e => targetIds.includes(e.activityId));
          const used = typeExp.reduce((sum, e) => sum + Number(e.amount), 0);
          const percent = allocated > 0 ? (used / allocated) * 100 : 0;
          return { type, allocated, used, percent: Math.min(percent, 100) };
        }).filter(d => d.allocated > 0);

        const incomeChartData = uniqueActivityNames.map(name => {
          const total = activities.filter(a => a.name === name).reduce((sum, a) => sum + Number(a.allocatedBudget), 0);
          return { name, value: total };
        }).filter(d => d.value > 0);

        const expenseChartData = uniqueActivityNames.map(name => {
          const actIds = activities.filter(a => a.name === name).map(a => a.id);
          const total = expenses.filter(e => actIds.includes(e.activityId)).reduce((sum, e) => sum + Number(e.amount), 0);
          return { name, value: total };
        }).filter(d => d.value > 0);

        const handleAddActivity = async () => {
          if (!newAct.name || !newAct.allocatedBudget) { showToast("กรุณากรอกชื่อกิจกรรมและยอดเงิน"); return; }
          setIsSaving(true);
          const newId = new Date().getTime(); 
          const actData = { ...newAct, id: newId, allocatedBudget: Number(newAct.allocatedBudget), projectId: activeProject.projectName, projectResponsible: activeProject.responsible, managementGroup: activeProject.managementGroup, plan: activeProject.plan };
          try {
            await api.call('saveActivity', JSON.stringify(actData));
            setAllActivities([...allActivities, actData]);
            setNewAct({ name: '', allocatedBudget: '', moneyType: moneyTypes[0] || '', responsible: '', status: statusTypes[0] || 'ยังไม่เริ่มต้น' });
            showToast("เพิ่มกิจกรรมสำเร็จ");
          } catch(e) { showToast("บันทึกข้อมูลล้มเหลว"); }
          setIsSaving(false);
        };

        const startEditAct = (act) => { setEditingActId(act.id); setEditActForm({ ...act }); };
        const saveEditAct = async () => {
          setIsSaving(true);
          const updatedAct = { ...editActForm, allocatedBudget: Number(editActForm.allocatedBudget), projectId: activeProject.projectName, projectResponsible: activeProject.responsible, managementGroup: activeProject.managementGroup, plan: activeProject.plan };
          try {
            await api.call('saveActivity', JSON.stringify(updatedAct));
            setAllActivities(allActivities.map(a => a.id === editingActId ? updatedAct : a));
            setEditingActId(null);
            showToast("แก้ไขกิจกรรมสำเร็จ");
          } catch(e) { showToast("บันทึกข้อมูลล้มเหลว"); }
          setIsSaving(false);
        };

        const confirmDeleteAct = (id, name, moneyType) => {
          setConfirmModal({
            isOpen: true, title: 'ยืนยันการลบงบประมาณ',
            message: `คุณต้องการลบ "${name}" ใช่หรือไม่? รายการเบิกจ่ายที่เกี่ยวข้องจะถูกลบด้วย`,
            onConfirm: async () => {
              setIsSaving(true);
              setConfirmModal({ isOpen: false });
              try {
                await api.call('deleteActivity', id);
                setAllActivities(allActivities.filter(a => a.id !== id));
                setAllExpenses(allExpenses.filter(e => e.activityId !== id));
                showToast("ลบกิจกรรมสำเร็จ");
              } catch(e) { showToast("ลบข้อมูลล้มเหลว"); }
              setIsSaving(false);
            }
          });
        };

        const handleAddExpense = async () => {
          const targetAct = activities.find(a => a.name === newExp.activityName && a.moneyType === newExp.moneyType);
          if (!newExp.date || !newExp.type || !newExp.amount || !targetAct) { showToast("กรุณากรอกข้อมูลให้ครบและเลือกประเภทเงินให้ถูกต้อง"); return; }
          setIsSaving(true);
          const newId = new Date().getTime();
          const expData = { 
            id: newId, activityName: targetAct.name, activityId: targetAct.id, date: newExp.date, 
            type: newExp.type, details: newExp.details, amount: Number(newExp.amount), moneyType: newExp.moneyType, projectId: activeProject.projectName, projectResponsible: activeProject.responsible, managementGroup: activeProject.managementGroup, plan: activeProject.plan
          };
          try {
            await api.call('saveExpense', JSON.stringify(expData));
            setAllExpenses([...allExpenses, expData]);
            setNewExp({ ...newExp, date: '', details: '', amount: '' });
            showToast("เพิ่มรายจ่ายสำเร็จ");
          } catch(e) { showToast("บันทึกข้อมูลล้มเหลว"); }
          setIsSaving(false);
        };

        const startEditExp = (exp) => { 
          const act = activities.find(a => a.id === exp.activityId);
          setEditingExpId(exp.id); 
          let formattedDate = exp.date || '';
          if (formattedDate) {
            const d = new Date(formattedDate);
            if (!isNaN(d.getTime())) {
              const year = d.getFullYear();
              const month = String(d.getMonth() + 1).padStart(2, '0');
              const day = String(d.getDate()).padStart(2, '0');
              formattedDate = `${year}-${month}-${day}`;
            }
          }
          setEditExpForm({ ...exp, date: formattedDate, activityName: act?.name || exp.activityName || '', moneyType: act?.moneyType || '' }); 
        };
        
        const saveEditExp = async () => {
          const targetAct = activities.find(a => a.name === editExpForm.activityName && a.moneyType === editExpForm.moneyType);
          if(!targetAct) { showToast("กรุณาเลือกประเภทเงินที่มีอยู่ในกิจกรรมนี้"); return; }
          setIsSaving(true);
          const updatedExp = { ...editExpForm, amount: Number(editExpForm.amount), activityId: targetAct.id, activityName: targetAct.name, projectId: activeProject.projectName, projectResponsible: activeProject.responsible, managementGroup: activeProject.managementGroup, plan: activeProject.plan };
          try {
            await api.call('saveExpense', JSON.stringify(updatedExp));
            setAllExpenses(allExpenses.map(e => e.id === editingExpId ? updatedExp : e));
            setEditingExpId(null);
            showToast("แก้ไขรายจ่ายสำเร็จ");
          } catch(e) { showToast("บันทึกข้อมูลล้มเหลว"); }
          setIsSaving(false);
        };
        
        const confirmDeleteExp = (id, typeName, details) => {
          setConfirmModal({
            isOpen: true, title: 'ยืนยันการลบรายการเบิกจ่าย',
            message: `คุณต้องการลบรายการ "${typeName}${details ? ' - ' + details : ''}" ใช่หรือไม่?`,
            onConfirm: async () => {
              setIsSaving(true);
              setConfirmModal({ isOpen: false });
              try {
                await api.call('deleteExpense', id);
                setAllExpenses(allExpenses.filter(e => e.id !== id));
                showToast("ลบรายจ่ายสำเร็จ");
              } catch(e) { showToast("ลบข้อมูลล้มเหลว"); }
              setIsSaving(false);
            }
          });
        };

        return (
          <div className="space-y-4 md:space-y-6 animate-in fade-in duration-300 relative">
            <datalist id="activityNamesList">{uniqueActivityNames.map(name => <option key={name} value={name} />)}</datalist>
            <datalist id="responsibleList">{uniqueResponsibles.map(r => <option key={r} value={r} />)}</datalist>

            {/* Modal แก้ไขกิจกรรม */}
            {editingActId && (
              <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[200] p-4 animate-in fade-in">
                <div className="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[90vh] flex flex-col scale-in-center">
                  <div className="bg-blue-600 p-4 flex items-center justify-between text-white rounded-t-xl shrink-0">
                    <div className="flex items-center gap-2"><Edit size={18} /><h3 className="font-bold text-base md:text-sm">แก้ไขกิจกรรม</h3></div>
                    <button onClick={() => setEditingActId(null)} className="text-blue-100 hover:text-white p-1"><X size={20}/></button>
                  </div>
                  <div className="p-5 space-y-4 overflow-y-auto flex-grow">

            filename:     `รายงานการใช้งบ_${selectedActName || 'ทั้งหมด'}.pdf`,

            pagebreak:    { mode: ['css', 'legacy'], avoid: ['.page-break-avoid', 'tr'] }

              setIsExporting(false); showToast("ส่งออก PDF สำเร็จ");

                         <button className={`pb-3 px-5 text-base md:text-sm font-bold transition-colors whitespace-nowrap ${settingsModal.typeTab === 'expense' ? 'text-blue-600 border-b-[3px] border-blue-600' : 'text-gray-500 hover:text-gray-800'}`} onClick={() => setSettingsModal({ ...settingsModal, typeTab: 'expense' })}>ประเภทรายการ</button>

                               onKeyDown={async (e) => {

                             <button

                             >
                               <PlusCircle size={20} /> <span className="ml-2">เพิ่มใหม่</span>
                             </button>
                           </div>

                           <div className="bg-white rounded-2xl border border-gray-200 shadow-sm divide-y divide-gray-100 flex-grow overflow-y-auto min-h-[200px]">
                             {appModes.map((mode, idx) => (
                               <div key={mode.id} className="flex justify-between items-center px-4 sm:px-6 py-4 hover:bg-gray-50 transition-colors">
                                 {editingMode?.id === mode.id ? (
                                   <div className="flex flex-col sm:flex-row flex-1 items-center gap-2 mr-2 md:mr-4">
                                     <input type="text" className="border border-blue-400 focus:ring-2 outline-none px-4 py-2.5 rounded-xl w-full text-base font-bold text-blue-800 bg-blue-50 shadow-sm" value={editingMode.name} onChange={e => setEditingMode({...editingMode, name: e.target.value})} autoFocus />
                                     <div className="flex gap-2 w-full sm:w-auto shrink-0">
                                       <button onClick={async () => {
                                           if(!editingMode.name.trim()) return;
                                           setIsSaving(true);
                                           try {
                                             const newArr = appModes.map(m => m.id === mode.id ? { ...m, name: editingMode.name.trim() } : m);
                                             setAppModes(newArr);
                                             await api.call('saveConfigItem', 'appModes', JSON.stringify(newArr));
                                             setEditingMode(null);
                                             showToast("แก้ไขชื่อโหมดสำเร็จ");
                                           } catch(e) { showToast("แก้ไขล้มเหลว"); }
                                           setIsSaving(false);
                                       }} className="flex-1 sm:flex-none bg-green-500 hover:bg-green-600 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-colors active:scale-95 shrink-0 flex items-center justify-center gap-1"><Check size={18}/> บันทึก</button>
                                       <button onClick={() => setEditingMode(null)} className="flex-1 sm:flex-none bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors active:scale-95 shrink-0 flex items-center justify-center"><X size={18}/></button>
                                     </div>
                                   </div>
                                 ) : (
                                   <>
                                     <span className="text-gray-800 text-base font-bold truncate pr-4">{mode.name}</span>
                                     <div className="flex gap-1.5 shrink-0">
                                       <button onClick={() => setEditingMode({id: mode.id, name: mode.name})} className="text-blue-500 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1 transition-colors active:scale-95"><Edit size={16}/> <span className="hidden sm:inline">แก้ไข</span></button>
                                       {appModes.length > 1 && (
                                         <button onClick={async () => {
                                             // Check if projects exist under this mode
                                             const modeProjs = projects.filter(p => p.projectType === mode.id || (mode.id === 'NORMAL' && !p.projectType));
                                             if (modeProjs.length > 0) {
                                                 showToast(`ลบไม่ได้! มี ${modeProjs.length} รายการที่กำลังใช้งานหมวดหมู่นี้อยู่`);
                                                 return;
                                             }
                                             setIsSaving(true);
                                             try {
                                               const newArr = appModes.filter(m => m.id !== mode.id);
                                               setAppModes(newArr);
                                               await api.call('saveConfigItem', 'appModes', JSON.stringify(newArr));
                                               if (appMode === mode.id) setAppMode(newArr[0].id);
                                               showToast("ลบโหมดสำเร็จ");
                                             } catch(e) { showToast("ลบล้มเหลว"); }
                                             setIsSaving(false);
                                         }} className="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg font-bold text-xs sm:text-sm flex items-center gap-1 transition-colors active:scale-95"><Trash2 size={16}/> <span className="hidden sm:inline">ลบ</span></button>
                                       )}
                                     </div>
                                   </>
                                 )}
                               </div>
                             ))}
                           </div>
                         </>
                       ) : (
                         <>
                           <div className="flex flex-col sm:flex-row gap-3 mb-5 bg-gray-50 p-4 sm:p-5 rounded-2xl border border-gray-200">
                             <input type="text" placeholder="พิมพ์ชื่อประเภทที่ต้องการเพิ่ม... (กด Enter)" className="flex-grow px-5 py-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-base outline-none" value={newTypeInput} onChange={(e) => setNewTypeInput(e.target.value)}
                               onKeyDown={async (e) => {
                                 if (e.key === 'Enter' && newTypeInput.trim()) {
                                   const val = newTypeInput.trim();
                                   setIsSaving(true);
                                   try {
                                     let newArr;
                                     if (settingsModal.typeTab === 'money') {
                                       newArr = [...moneyTypes, val]; setMoneyTypes(newArr);
                                       await api.call('saveConfigItem', 'moneyTypes', JSON.stringify(newArr));
                                     } else if (settingsModal.typeTab === 'expense') {
                                       newArr = [...expenseTypes, val]; setExpenseTypes(newArr);
                                       await api.call('saveConfigItem', 'expenseTypes', JSON.stringify(newArr));
                                     } else if (settingsModal.typeTab === 'status') {
                                       newArr = [...statusTypes, val]; setStatusTypes(newArr);
                                       await api.call('saveConfigItem', 'statusTypes', JSON.stringify(newArr));
                                     }
                                     setNewTypeInput(''); showToast("เพิ่มข้อมูลสำเร็จ");
                                   } catch(err) { showToast("อัปเดตล้มเหลว"); }
                                   setIsSaving(false);
                                 }
                               }}
                             />
                             <button 
                               onClick={async () => {
                                 if (newTypeInput.trim()) {
                                   const val = newTypeInput.trim();
                                   setIsSaving(true);
                                   try {
                                     let newArr;
                                     if (settingsModal.typeTab === 'money') {
                                       newArr = [...moneyTypes, val]; setMoneyTypes(newArr);
                                       await api.call('saveConfigItem', 'moneyTypes', JSON.stringify(newArr));
                                     } else if (settingsModal.typeTab === 'expense') {
                                       newArr = [...expenseTypes, val]; setExpenseTypes(newArr);
                                       await api.call('saveConfigItem', 'expenseTypes', JSON.stringify(newArr));
                                     } else if (settingsModal.typeTab === 'status') {
                                       newArr = [...statusTypes, val]; setStatusTypes(newArr);
                                       await api.call('saveConfigItem', 'statusTypes', JSON.stringify(newArr));
                                     }
                                     setNewTypeInput(''); showToast("เพิ่มข้อมูลสำเร็จ");
                                   } catch(err) { showToast("อัปเดตล้มเหลว"); }
                                   setIsSaving(false);
                                 }
                               }}
                               disabled={isSaving || !newTypeInput.trim()}
                               className="bg-blue-600 text-white px-6 py-3.5 rounded-xl hover:bg-blue-700 disabled:opacity-50 transition-colors flex items-center justify-center shadow-sm shrink-0 w-full sm:w-auto font-bold text-base active:scale-95"
                             >
                               <PlusCircle size={20} /> <span className="ml-2">เพิ่มใหม่</span>
                             </button>
                           </div>
                           
                           <div className="bg-white rounded-2xl border border-gray-200 shadow-sm divide-y divide-gray-100 flex-grow overflow-y-auto min-h-[200px]">
                             {(settingsModal.typeTab === 'money' ? moneyTypes : settingsModal.typeTab === 'expense' ? expenseTypes : statusTypes).map((type, idx) => (
                               <div key={idx} className="flex justify-between items-center px-6 py-4 hover:bg-gray-50 transition-colors">
                                 <span className="text-gray-800 text-base font-bold">{type}</span>
                                 <button onClick={async () => {
                                     setIsSaving(true);
                                     try {
                                       let newArr;
                                       if (settingsModal.typeTab === 'money') {
                                         newArr = moneyTypes.filter(t => t !== type); setMoneyTypes(newArr);
                                         await api.call('saveConfigItem', 'moneyTypes', JSON.stringify(newArr));
                                       } else if (settingsModal.typeTab === 'expense') {
                                         newArr = expenseTypes.filter(t => t !== type); setExpenseTypes(newArr);
                                         await api.call('saveConfigItem', 'expenseTypes', JSON.stringify(newArr));
                                       } else if (settingsModal.typeTab === 'status') {
                                         newArr = statusTypes.filter(t => t !== type); setStatusTypes(newArr);
                                         await api.call('saveConfigItem', 'statusTypes', JSON.stringify(newArr));
                                       }
                                       showToast("ลบข้อมูลสำเร็จ");
                                     } catch(e) { showToast("ลบไม่สำเร็จ"); }
                                     setIsSaving(false);
                                   }}
                                   className="text-red-500 bg-red-50 hover:bg-red-100 hover:text-red-700 px-4 py-2.5 rounded-xl transition-colors disabled:opacity-50 flex items-center gap-1.5 text-sm font-bold active:scale-95" title="ลบ"><Trash2 size={18} /> <span className="hidden sm:inline">ลบ</span></button>
                               </div>
                             ))}
                             {(settingsModal.typeTab === 'money' ? moneyTypes : settingsModal.typeTab === 'expense' ? expenseTypes : statusTypes).length === 0 && (
                               <div className="p-10 text-center text-gray-400 text-base font-bold">ยังไม่มีข้อมูลในหมวดหมู่นี้</div>
                             )}
                           </div>
                         </>
                       )}
                    </div>
                  )}

                  {settingsModal.activeTab === 'security' && (
                    <div className="space-y-6 animate-in fade-in">
                      <div className="bg-yellow-50 p-6 border border-yellow-200 rounded-2xl text-sm md:text-base text-yellow-800 flex flex-col md:flex-row gap-4 md:gap-5 items-start">
                        <ShieldAlert size={32} className="shrink-0 text-yellow-600 mt-1" />
                        <div>
                          <strong className="text-lg block mb-2">การจัดการความปลอดภัย</strong>
                          <p className="leading-relaxed font-medium">การเปลี่ยนรหัสผ่านจะมีผลทันที กรุณาจดจำรหัสผ่านใหม่ให้ดี หากลืมรหัสผ่านยังคงสามารถใช้รหัส <strong className="text-red-600">"admin999"</strong> เป็นรหัสผ่านสำรองในการเข้าสู่ระบบได้เสมอ</p>
                        </div>
                      </div>
                      <div className="bg-gray-50 p-6 rounded-2xl border border-gray-200">
                        <label className="block text-gray-800 text-base font-bold mb-3">ตั้งรหัสผ่านใหม่สำหรับผู้ดูแลระบบ (Admin)</label>
                        <input 
                          type="text" 
                          className="w-full max-w-md px-5 py-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 font-bold text-lg tracking-widest" 
                          placeholder="กรอกรหัสผ่านใหม่..."
                          value={settingsModal.password} 
                          onChange={e => setSettingsModal({...settingsModal, password: e.target.value})}

                      </div>
                    </div>
                  )}

                  <div className="flex flex-col-reverse sm:flex-row justify-end gap-3">

                    {(settingsModal.activeTab === 'project-edit' || settingsModal.activeTab === 'general' || settingsModal.activeTab === 'security') && (
                      <button 
                        onClick={async () => { 
                          setIsSaving(true);
                          try {
                            if (settingsModal.activeTab === 'project-edit') {
                              const oldProjectName = activeProject.projectName;
                              const newData = settingsModal.editProjectData;
                              const currentProjectId = activeProject.id;
                              
                              // 1. อัปเดตข้อมูลโครงการใน Config
                              const updatedProjects = projects.map(p => p.id === currentProjectId ? newData : p);
                              await api.call('saveConfigItem', 'projects', JSON.stringify(updatedProjects));
                              setProjects(updatedProjects);

                              // 2. อัปเดตข้อมูล กิจกรรม และ รายจ่าย ทั้งหมดที่ผูกกับโครงการนี้ ให้เป็นข้อมูลใหม่
                              const updatePromises = [];
                              let actsUpdatedCount = 0;
                              let expsUpdatedCount = 0;
                              
                              const updatedActivities = allActivities.map(act => {
                                // เช็คว่ากิจกรรมนี้ผูกกับโครงการที่กำลังแก้ไขหรือไม่
                                // (รองรับกรณีเก็บเป็นชื่อโครงการเก่า, ID โครงการ, หรือ 'default' ถ้ากำลังแก้ default)
                                const isBelongToProject = act.projectId === oldProjectName || act.projectId === currentProjectId || (act.projectId === 'default' && currentProjectId === 'default');
                                
                                if (isBelongToProject) {
                                  // ถ้าข้อมูลใดข้อมูลหนึ่งเปลี่ยน ให้สร้าง object ใหม่เพื่ออัปเดต
                                  if (act.projectId !== newData.projectName || act.projectResponsible !== newData.responsible || act.managementGroup !== newData.managementGroup || act.plan !== newData.plan) {
                                    const updatedAct = { 
                                      ...act, 
                                      projectId: newData.projectName, // อัปเดตชื่อโครงการ
                                      projectResponsible: newData.responsible, // อัปเดตผู้รับผิดชอบ
                                      managementGroup: newData.managementGroup, // อัปเดตกลุ่มบริหาร
                                      plan: newData.plan // อัปเดตแผนงาน
                                    };
                                    updatePromises.push(api.call('saveActivity', JSON.stringify(updatedAct)));
                                    actsUpdatedCount++;
                                    return updatedAct;
                                  }
                                }
                                return act;
                              });
                              
                              const updatedExpenses = allExpenses.map(exp => {
                                const isBelongToProject = exp.projectId === oldProjectName || exp.projectId === currentProjectId || (exp.projectId === 'default' && currentProjectId === 'default');
                                
                                if (isBelongToProject) {
                                  if (exp.projectId !== newData.projectName || exp.projectResponsible !== newData.responsible || exp.managementGroup !== newData.managementGroup || exp.plan !== newData.plan) {
                                    const updatedExp = { 
                                      ...exp, 
                                      projectId: newData.projectName,
                                      projectResponsible: newData.responsible,
                                      managementGroup: newData.managementGroup,
                                      plan: newData.plan
                                    };
                                    updatePromises.push(api.call('saveExpense', JSON.stringify(updatedExp)));
                                    expsUpdatedCount++;
                                    return updatedExp;
                                  }
                                }
                                return exp;
                              });
                              
                              // ถ้ารายการใดถูกปรับแก้ ให้รอจนกว่าจะบันทึกลงชีทเสร็จทั้งหมด
                              if (updatePromises.length > 0) {
                                await Promise.all(updatePromises);
                                setAllActivities(updatedActivities);
                                setAllExpenses(updatedExpenses);
                                console.log(`อัปเดตข้อมูลโครงการไปยัง กิจกรรม: ${actsUpdatedCount} รายการ, รายจ่าย: ${expsUpdatedCount} รายการ`);
                              }
                            }
                            if (settingsModal.activeTab === 'general') {
                              await api.call('saveConfigItem', 'themeColors', JSON.stringify(settingsModal.colors));
                              setThemeColors(settingsModal.colors);
                              await api.call('saveConfigItem', 'schoolName', settingsModal.schoolName);
                              setSchoolName(settingsModal.schoolName);
                            }
                            if (settingsModal.activeTab === 'security' && settingsModal.password && settingsModal.password !== adminPassword) {
                              await api.call('saveConfigItem', 'adminPassword', settingsModal.password);
                              setAdminPassword(settingsModal.password);
                            }
                            setSettingsModal({...settingsModal, isOpen: false});
                            showToast("บันทึกการตั้งค่าระบบสำเร็จ");
                          } catch(e) { showToast("บันทึกไม่สำเร็จ"); }
                          setIsSaving(false);
                        }} 
                        className="w-full sm:w-auto px-6 py-4 sm:py-3.5 bg-blue-600 text-white rounded-2xl md:rounded-xl hover:bg-blue-700 font-bold shadow-md flex justify-center items-center gap-2 transition-colors active:scale-95 text-base"
                      >
                        <Check size={20} /> บันทึกการเปลี่ยนแปลง
                      </button>
                    )}
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
